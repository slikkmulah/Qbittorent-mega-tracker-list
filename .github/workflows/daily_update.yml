name: Daily Tracker Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_update.yml"

concurrency:
  group: daily-tracker-sync
  cancel-in-progress: false

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tracking aggregation script
        run: python update_trackers.py

      - name: Check combined tracker list
        run: |
          if [ ! -f combined_trackers.txt ]; then
            echo "Error: combined_trackers.txt was not created."
            exit 1
          fi

      - name: Test trackers with TrackerPing
        run: |
          trackerping -l -o working_trackers.txt combined_trackers.txt

      - name: Replace combined list with working trackers
        run: |
          if [ ! -f working_trackers.txt ]; then
            echo "Error: TrackerPing did not create working_trackers.txt."
            exit 1
          fi

          mv working_trackers.txt combined_trackers.txt

      - name: Commit and push updated tracker list
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp combined_trackers.txt /tmp/combined_trackers.txt

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combined_trackers.txt combined_trackers.txt
            git add combined_trackers.txt

            if git diff --cached --quiet; then
              echo "No changes detected in combined_trackers.txt"
              exit 0
            fi

            git commit -m "Update trackers list"

            if git push origin HEAD:main; then
              echo "Tracker list pushed successfully."
              exit 0
            fi

            echo "main changed before the push completed; syncing and retrying..."
          done

          echo "Error: Could not push tracker list after 5 attempts."
          exit 1
