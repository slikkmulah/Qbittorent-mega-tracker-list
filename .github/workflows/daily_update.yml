name: Daily Tracker Sync

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_update.yml"
      - "update_trackers.py"
      - "validate_trackers.py"
      - "test_validate_trackers.py"
      - "requirements.txt"

concurrency:
  group: daily-tracker-sync
  cancel-in-progress: false

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test strict tracker validator
        run: python -m unittest -v test_validate_trackers.py

      - name: Aggregate high-confidence tracker sources
        run: python update_trackers.py

      - name: Strictly validate tracker announce responses
        run: |
          python validate_trackers.py \
            combined_trackers.txt \
            working_trackers.txt \
            --rejected rejected_trackers.txt \
            --timeout 10 \
            --passes 2 \
            --concurrency 32

      - name: Replace combined list with validated trackers
        run: |
          if [ ! -s working_trackers.txt ]; then
            echo "Error: strict validation produced no working trackers."
            exit 1
          fi

          mv working_trackers.txt combined_trackers.txt

          echo "Final tracker count:"
          grep -cve '^$' combined_trackers.txt

      - name: Commit and push updated tracker list
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp combined_trackers.txt /tmp/combined_trackers.txt

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combined_trackers.txt combined_trackers.txt
            git add combined_trackers.txt

            if git diff --cached --quiet; then
              echo "No changes detected in combined_trackers.txt"
              exit 0
            fi

            git commit -m "Update strictly validated tracker list"

            if git push origin HEAD:main; then
              echo "Tracker list pushed successfully."
              exit 0
            fi

            echo "main changed before the push completed; syncing and retrying..."
          done

          echo "Error: Could not push tracker list after 5 attempts."
          exit 1

