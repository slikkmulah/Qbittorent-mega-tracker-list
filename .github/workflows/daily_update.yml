name: Daily Tracker Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Upgraded from @v4 to @v6 to resolve Node.js 20 deprecation
      - name: Checkout repository code
        uses: actions/checkout@v6

      # Upgraded from @v5 to @v6 to resolve Node.js 20 deprecation
      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tracking aggregation script
        run: python update_trackers.py

      - name: Commit and push updated text file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f combined_trackers.txt ]; then
            git add combined_trackers.txt
            
            if ! git diff --cached --quiet; then
              git commit -m "Update trackers list"
              git pull --rebase origin main
              git push origin main
            else
              echo "No changes detected in combined_trackers.txt"
            fi
          else
            echo "Error: combined_trackers.txt was not created by the script."
            exit 1
          fi
