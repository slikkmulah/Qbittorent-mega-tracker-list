name: Daily Tracker Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-tracker-sync
  cancel-in-progress: false

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tracking aggregation script
        run: python update_trackers.py

      - name: Check combined tracker list
        run: |
          if [ ! -f combined_trackers.txt ]; then
            echo "Error: combined_trackers.txt was not created."
            exit 1
          fi

      - name: Test trackers with TrackerPing
        run: |
          trackerping -l -o working_trackers.txt combined_trackers.txt

      - name: Replace combined list with working trackers
        run: |
          if [ ! -f working_trackers.txt ]; then
            echo "Error: TrackerPing did not create working_trackers.txt."
            exit 1
          fi

          mv working_trackers.txt combined_trackers.txt

            - name: Commit and push updated tracker list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combined_trackers.txt

          if git diff --cached --quiet; then
            echo "No changes detected in combined_trackers.txt"
            exit 0
          fi

          git commit -m "Update trackers list"

          # Get anything that changed on main while this job was running
          git fetch origin main

          # Replay our tracker update on top of the newest main
          if ! git rebase origin/main; then
            echo "combined_trackers.txt changed remotely. Keeping the newly generated tracker list."

            git show REBASE_HEAD:combined_trackers.txt > combined_trackers.txt
            git add combined_trackers.txt
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin HEAD:main
