name: Daily Tracker Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-tracker-sync
  cancel-in-progress: false

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tracking aggregation script
        run: python update_trackers.py

      - name: Commit and push updated text file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f combined_trackers.txt ]; then
            echo "Error: combined_trackers.txt was not created by the script."
            exit 1
          fi

          git add combined_trackers.txt

          if git diff --cached --quiet; then
            echo "No changes detected in combined_trackers.txt"
            exit 0
          fi

          git commit -m "Update trackers list"

          git push origin HEAD:main
